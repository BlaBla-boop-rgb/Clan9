# Texte nutzen MiniMessage: https://docs.advntr.dev/minimessage/format.html

prefix: "<dark_gray>[<gold>Clan<dark_gray>]<gray> "
no-clan-name: "kein Clan"
no-clan-tab: "<dark_gray>[<gray>kein Clan<dark_gray>]"

# Clan-Tag hinter dem Namen in der Tabliste. Der Rang vor dem Namen bleibt unverändert.
tab-list-name: true

min-length: 3
max-length: 10
# 0 = unbegrenzt
max-members: 20
# Einladungen verfallen nach X Sekunden
invite-expire-seconds: 120

# Nur der Leiter darf die Farbe ändern
color-needs-leader: true
# Permission für Clan-Farben
vip-permission: "vip.booster"

gui:
  sounds: true
  # Einmalige Aufbau-Animation beim Öffnen (Spalten blenden von links nach rechts ein)
  open-animation: true

# Resource Pack mit den Custom-Icons
resource-pack:
  # auto   = Custom-Icons nur für Spieler, die das Pack geladen haben (sonst normale Items)
  # always = immer Custom-Icons (z.B. wenn du das Pack selbst über server.properties verteilst)
  # never  = nie Custom-Icons
  mode: auto
  send-on-join: true
  required: false
  # Direktlink zur ClansPack.zip (muss öffentlich erreichbar sein).
  # Standard: die Datei aus deinem GitHub-Repo. Die Datei liegt auch unter plugins/Clans/ClansPack.zip
  url: "https://raw.githubusercontent.com/BlaBla-boop-rgb/Clan8/main/src/main/resources/ClansPack.zip"
